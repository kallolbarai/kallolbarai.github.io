teaching:
- 'Graduate Teaching Assistant | University of Maine | 2020–2023 | Supervisor: Dr.
  Julia McGuire'
- Worked as a Teaching Assistant for Basic Biology (BIO 100) & Biology of Organisms
  (BIO 200) courses.
- Taught laboratory sections for introductory biology courses, delivering instruction
  on experimental design, ecological methods, and core biological concepts.
- Trained students in laboratory techniques and ensured compliance with laboratory
  safety and ethical research standards.
- Coordinated and supervised ecological research experiments, supporting student learning
  in data collection, analysis, and interpretation.
- Collaborated with course instructors to enhance laboratory curriculum, instructional
  strategies, and student engagement.
- Led review sessions and assessed laboratory reports and assignments, providing timely,
  constructive feedback.
- Teaching Assistant Mentor, BIO 100 (2023)
- Mentored newly appointed teaching assistants by providing guidance on effective
  teaching practices, classroom management, and student-centered instructional approaches.
- Veteran Teaching Assistant, BIO 100 (2023) UMaine Research Learning Experiences
  (RLE) Program
- Served as a veteran teaching assistant for the UMaine Research Learning Experiences
  program, teaching specialized sections of BIO 100 for students with a focused interest
  in ecological research.
- Guided students in research-oriented laboratory activities, emphasizing inquiry-based
  learning, experimental design, and exposure to authentic ecological research practices.
- Pedagogical Training and Teaching Development
- Veteran Teaching Assistant, Student-Centered Teaching Seminar — University of Maine
  Center for Innovation in Teaching and Learning (CITL), 2024 (inclusive, student-centered,
  evidence-based teaching).
- 'Graduate Teaching Academy — University of Maine Center for Innovation in Teaching
  and Learning (CITL), 2025: completed formal pedagogical training and earned a Certificate
  in Teaching (inclusive pedagogy, evidence-based instruction, reflective teaching
  practice).'
