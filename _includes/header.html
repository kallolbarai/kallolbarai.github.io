{% assign p = site.data.profile %}
<header class="site-header" role="banner">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__name">{{ p.name }}</span>
      <span class="brand__tagline">{{ p.tagline }}</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="navMenu">Menu</button>
      <ul class="nav__menu" id="navMenu">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/pages/research/' | relative_url }}">Research</a></li>
        <li><a href="{{ '/pages/publications/' | relative_url }}">Publications</a></li>
        <li><a href="{{ '/pages/teaching/' | relative_url }}">Teaching</a></li>
        <li><a href="{{ '/pages/cv/' | relative_url }}">CV</a></li>
        <li><a href="{{ '/pages/contact/' | relative_url }}">Contact</a></li>
      </ul>
    </nav>

    <div class="controls">
      <button class="btn btn--ghost" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </div>
</header>
